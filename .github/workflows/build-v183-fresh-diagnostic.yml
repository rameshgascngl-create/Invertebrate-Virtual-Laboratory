name: Build INVERTEBRATA v1.8.4 Reading Edition

on:
  push:
    branches:
      - invertebrata-v1.8.3-fresh-diagnostic
    paths:
      - '.github/workflows/build-v183-fresh-diagnostic.yml'
      - 'app/**'
      - 'source/index184.xz.b64'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Reconstruct audited v1.8.4 course payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/www
          base64 --decode source/index184.xz.b64 > /tmp/index184.html.xz
          xz --decompress --stdout /tmp/index184.html.xz > app/src/main/assets/www/index.html
          echo "579129fe89341539739c4e7b751a1f7109bc351b1487021d715adc20db5a3177  app/src/main/assets/www/index.html" | sha256sum --check -
          test "$(wc -c < app/src/main/assets/www/index.html)" -eq 2157739
          grep -Fq 'textbook-description-only' app/src/main/assets/www/index.html
          grep -Fq 'fitSyllabusVisualMedia' app/src/main/assets/www/index.html
          grep -Fq 'v1.8.4 Reading Edition' app/src/main/assets/www/index.html

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Fresh Gradle build
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean :app:assembleDebug --stacktrace

      - name: Verify fresh full APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/signature.txt
          BADGING="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | tee /tmp/badging.txt
          grep -Fq "package: name='com.gasczoology.invertebratafull184' versionCode='184' versionName='1.8.4'" <<<"$BADGING"
          grep -Fq "application-label:'INVERTEBRATA'" <<<"$BADGING"
          unzip -p "$APK" assets/www/index.html > /tmp/apk-index.html
          cmp --silent app/src/main/assets/www/index.html /tmp/apk-index.html
          echo "579129fe89341539739c4e7b751a1f7109bc351b1487021d715adc20db5a3177  /tmp/apk-index.html" | sha256sum --check -
          ! unzip -l "$APK" | grep -E 'assets/www/.*\.(jpg|jpeg|png)$'
          sha256sum "$APK" | tee /tmp/apk.sha256
          {
            echo 'INVERTEBRATA v1.8.4 Reading Edition — fresh Gradle build'
            echo 'Package: com.gasczoology.invertebratafull184'
            echo 'Version: 1.8.4 / 184'
            echo 'Embedded HTML SHA-256: 579129fe89341539739c4e7b751a1f7109bc351b1487021d715adc20db5a3177'
            echo 'Presentation: concise description + figure; contained figure zoom'
            echo 'Build path: Gradle source compile; no APK repackaging'
            cat /tmp/apk.sha256
          } > /tmp/verification.txt

      - name: Stage release candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/INVERTEBRATA-v1.8.4-READING-EDITION-FRESH.apk
          cp /tmp/verification.txt output/VERIFICATION.txt
          cp /tmp/signature.txt output/SIGNATURE.txt
          cp /tmp/badging.txt output/BADGING.txt

      - name: Upload v1.8.4 APK
        uses: actions/upload-artifact@v4
        with:
          name: INVERTEBRATA-v1.8.4-READING-EDITION-FRESH
          path: output/
          if-no-files-found: error
          retention-days: 30
