name: Cockroach Android v2.1.1 Corrected Production CI

on:
  push:
    branches:
      - cockroach-android-v2.1.1
    paths:
      - 'cockroach-android-v2-src/**'
      - '.github/workflows/cockroach-android-v211.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct audited v2.1.0 Android baseline
        shell: bash
        run: |
          set -euo pipefail
          SRC=cockroach-android-v2-src
          for n in 00 01 02 03 04 05 06 07 08 09 10; do test -f "$SRC/part${n}.b64"; done
          test -f "$SRC/part12.b64"
          for f in p11a0.txt p11a1.txt p11a20.txt p11a21.txt p11a22-raw.txt p11a23.txt p11a3.txt p11b.txt p11c.txt p11d.txt; do test -f "$SRC/$f"; done
          : > /tmp/project.tar.xz.b64
          for n in 00 01 02 03 04 05 06 07 08 09 10; do cat "$SRC/part${n}.b64" >> /tmp/project.tar.xz.b64; done
          cat "$SRC/p11a0.txt" "$SRC/p11a1.txt" "$SRC/p11a20.txt" "$SRC/p11a21.txt" >> /tmp/project.tar.xz.b64
          base64 --decode "$SRC/p11a22-raw.txt" >> /tmp/project.tar.xz.b64
          cat "$SRC/p11a23.txt" "$SRC/p11a3.txt" "$SRC/p11b.txt" "$SRC/p11c.txt" "$SRC/p11d.txt" >> /tmp/project.tar.xz.b64
          cat "$SRC/part12.b64" >> /tmp/project.tar.xz.b64
          test "$(wc -c < /tmp/project.tar.xz.b64)" -eq 99228
          base64 --decode /tmp/project.tar.xz.b64 > /tmp/project.tar.xz
          test "$(wc -c < /tmp/project.tar.xz)" -eq 74420
          echo "2e0987f56a00a6cf550dcf59c350bf8144a0186dd57a684b24c5defb6773cf54  /tmp/project.tar.xz" | sha256sum --check -
          mkdir -p /tmp/cockroach-build
          tar -xJf /tmp/project.tar.xz -C /tmp/cockroach-build
          echo "PROJECT_DIR=/tmp/cockroach-build/CockroachVirtualDissectionAndroid" >> "$GITHUB_ENV"

      - name: Apply Android compatibility and v2.1.1 correction
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle'); s=p.read_text(encoding='utf-8')
          for old,new in {'androidx.activity:activity:1.13.0':'androidx.activity:activity:1.11.0','androidx.core:core:1.19.0':'androidx.core:core:1.17.0'}.items():
              if old not in s: raise SystemExit(f'Expected dependency missing: {old}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          base=Path('app/src/main/res/values/styles.xml'); original=base.read_text(encoding='utf-8')
          item='        <item name="android:windowLightNavigationBar">false</item>\n'
          if original.count(item)!=1: raise SystemExit('Expected API-27 style item missing')
          base.write_text(original.replace(item,''),encoding='utf-8')
          v27=Path('app/src/main/res/values-v27/styles.xml'); v27.parent.mkdir(parents=True,exist_ok=True); v27.write_text(original,encoding='utf-8')
          test=Path('app/src/androidTest/java/in/gov/tn/gascngl/zoology/cockroachlab/MainActivityInstrumentedTest.java')
          ts=test.read_text(encoding='utf-8')
          if '}), 800);' not in ts: raise SystemExit('Expected startup delay missing')
          test.write_text(ts.replace('}), 800);','}), 5000);',1),encoding='utf-8')
          PY
          PATCH="$GITHUB_WORKSPACE/cockroach-android-v2-src/v2.1.1-organ-blink.patch"
          echo "17cb55413e412be6974144e15307b40fc9317a4b3ad008f28cfe9280dae8e138  $PATCH" | sha256sum --check -
          patch -p1 < "$PATCH"
          echo "08143a01bfe6e98c671d0cf4e4a4b63ea98c188c5f2355155361b51fb3b4a90c  app/src/main/assets/www/index.html" | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle'); s=p.read_text(encoding='utf-8')
          if 'versionCode 21000' not in s or "versionName '2.1.0'" not in s: raise SystemExit('Expected v2.1.0 version missing')
          p.write_text(s.replace('versionCode 21000','versionCode 21100',1).replace("versionName '2.1.0'","versionName '2.1.1'",1),encoding='utf-8')
          p=Path('tools/verify_lab.py'); s=p.read_text(encoding='utf-8')
          s=s.replace("assert 'Practical-first bilingual teaching release v2.1.0' in s","assert 'Practical-first bilingual teaching release v2.1.1' in s")
          anchor="assert 'teaching reconstructions, not specimen photographs' in s\n"
          checks=("assert 'v2-organ-button' in s\nassert 'v2-organ-blink' in s\nassert 'v2-organ-halo' in s\nassert 'flashV2Organ' in s\n"
                  "assert 'Tap an organ name to blink its position' in s\nassert 'data-android-ready=\\\"true\\\"' in s\n"
                  "assert 'AndroidBridge.saveProgressBackup' in s\nassert 'AndroidBridge.speakSegments' in s\nassert 'AndroidBridge.stopSpeech' in s\n")
          if "assert 'v2-organ-button' in s" not in s: s=s.replace(anchor,anchor+checks,1)
          p.write_text(s,encoding='utf-8')
          p=Path('app/src/androidTest/java/in/gov/tn/gascngl/zoology/cockroachlab/MainActivityInstrumentedTest.java'); s=p.read_text(encoding='utf-8')
          marker='    @Test\n    public void webStorageSurvivesActivityRecreation() throws Exception {'
          method=("    @Test\n"
                  "    public void enhancedPlateOrganNameBlinksSelectedAnatomy() throws Exception {\n"
                  "        try (ActivityScenario<MainActivity> scenario = ActivityScenario.launch(MainActivity.class)) {\n"
                  "            String js = \"(function(){var r=document.getElementById('cockroach-lab-v1');if(!r)return false;var h=r.querySelector('#v2Handbook'),hb=r.querySelector('#v2HandbookBtn');if(!h||!hb)return false;if(h.hidden)hb.click();if(h.hidden)return false;var plate=r.querySelector('.v2-plate');if(!plate)return false;var b=plate.querySelector('.v2-organ-button');if(!b)return false;b.click();var svg=plate.querySelector('svg');return !!svg.querySelector('.v2-organ-blink')&&!!svg.querySelector('.v2-organ-halo')&&plate.querySelector('.v2-organ-help').textContent.indexOf('highlighted')>=0;})()\";\n"
                  "            assertEquals(\"true\", evaluate(scenario, js));\n"
                  "        }\n"
                  "    }\n\n")
          if 'enhancedPlateOrganNameBlinksSelectedAnatomy' not in s:
              if marker not in s: raise SystemExit('Instrumentation insertion point missing')
              s=s.replace(marker,method+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq 'versionCode 21100' app/build.gradle
          grep -Fq "versionName '2.1.1'" app/build.gradle
          grep -Fq 'enhancedPlateOrganNameBlinksSelectedAnatomy' app/src/androidTest/java/in/gov/tn/gascngl/zoology/cockroachlab/MainActivityInstrumentedTest.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'emulator'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Static scientific HTML and Android bridge audit
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          grep -Fq "id 'com.android.application' version '9.3.2'" build.gradle
          python3 tools/verify_lab.py

      - name: JavaScript syntax audit
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/src/main/assets/www/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          assert scripts
          Path('/tmp/cockroach-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/cockroach-inline.js

      - name: Build lint and package
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle :app:lintDebug :app:assembleDebug :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Verify v2.1.1 APK package and corrected laboratory
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          APK=app/build/outputs/apk/debug/app-debug.apk
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$APK")"
          grep -Fq "package: name='in.gov.tn.gascngl.zoology.cockroachlab' versionCode='21100' versionName='2.1.1'" <<<"$BADGING"
          unzip -p "$APK" assets/www/index.html > /tmp/apk-index.html
          cmp --silent /tmp/apk-index.html app/src/main/assets/www/index.html
          echo "08143a01bfe6e98c671d0cf4e4a4b63ea98c188c5f2355155361b51fb3b4a90c  /tmp/apk-index.html" | sha256sum --check -
          grep -Fq 'v2-organ-blink' /tmp/apk-index.html
          grep -Fq 'AndroidBridge.saveProgressBackup' /tmp/apk-index.html
          grep -Fq 'AndroidBridge.speakSegments' /tmp/apk-index.html
          ! grep -q '<uses-permission android:name="android.permission.INTERNET"' app/src/main/AndroidManifest.xml

      - name: Enable KVM hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm || { echo '::error::/dev/kvm unavailable'; exit 1; }
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: API 36 emulator instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          disable-linux-hw-accel: false
          script: cd "$PROJECT_DIR" && gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Package verified v2.1.1 outputs
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/Cockroach-Virtual-Dissection-v2.1.1-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/Cockroach-Virtual-Dissection-v2.1.1-release-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/Cockroach-Virtual-Dissection-v2.1.1-release-unsigned.aab
          {
            echo '# Cockroach Virtual Dissection Laboratory v2.1.1 — CI Build Report'
            echo '- Baseline SHA-256: PASS — 2e0987f56a00a6cf550dcf59c350bf8144a0186dd57a684b24c5defb6773cf54'
            echo '- v2.1.1 patch SHA-256: PASS — 17cb55413e412be6974144e15307b40fc9317a4b3ad008f28cfe9280dae8e138'
            echo '- Final HTML SHA-256: PASS — 08143a01bfe6e98c671d0cf4e4a4b63ea98c188c5f2355155361b51fb3b4a90c'
            echo '- Package/version: in.gov.tn.gascngl.zoology.cockroachlab 2.1.1 (21100)'
            echo '- AGP 9.3.2 / Gradle 9.5.0 / JDK 17 / API 36: PASS'
            echo '- Lint, scientific/HTML, JavaScript, native bridge and organ-blink checks: PASS'
            echo '- Debug APK, unsigned release APK and unsigned AAB: PASS'
          } > artifacts/CI_BUILD_REPORT.md
          {
            echo '# Cockroach Virtual Dissection Laboratory v2.1.1 — CI Device Test Report'
            echo '- API 36 Google APIs x86_64 emulator: PASS'
            echo '- Instrumentation suite: PASS'
            echo '- Organ-name -> anatomy blink/halo test: PASS'
            echo '- Physical-phone TTS/document-picker/stress testing remains recommended before public release.'
          } > artifacts/CI_DEVICE_TEST_REPORT.md
          (
            cd /tmp/cockroach-build
            zip -qr "$PROJECT_DIR/artifacts/CockroachVirtualDissectionAndroidStudio_v2.1.1.zip" CockroachVirtualDissectionAndroid \
              -x 'CockroachVirtualDissectionAndroid/app/build/*' 'CockroachVirtualDissectionAndroid/.gradle/*' 'CockroachVirtualDissectionAndroid/artifacts/*'
          )
          sha256sum artifacts/Cockroach-Virtual-Dissection-v2.1.1-* artifacts/CockroachVirtualDissectionAndroidStudio_v2.1.1.zip > artifacts/SHA256SUMS.txt

      - name: Upload verified v2.1.1 build outputs
        uses: actions/upload-artifact@v4
        with:
          name: Cockroach-Virtual-Dissection-v2.1.1-corrected-build
          path: /tmp/cockroach-build/CockroachVirtualDissectionAndroid/artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload v2.1.1 test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cockroach-Virtual-Dissection-v2.1.1-test-reports
          path: |
            /tmp/cockroach-build/CockroachVirtualDissectionAndroid/app/build/reports/
            /tmp/cockroach-build/CockroachVirtualDissectionAndroid/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 30
