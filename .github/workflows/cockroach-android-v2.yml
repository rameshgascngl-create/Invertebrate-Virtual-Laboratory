name: Cockroach Android v2.1.0 Production CI

on:
  push:
    branches:
      - cockroach-android-v2.1.0
    paths:
      - 'cockroach-android-v2-src/**'
      - '.github/workflows/cockroach-android-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct audited Android Studio project
        shell: bash
        run: |
          set -euo pipefail
          SRC=cockroach-android-v2-src
          for n in 00 01 02 03 04 05 06 07 08 09 10; do
            test -f "$SRC/part${n}.b64"
          done
          test -f "$SRC/part12.b64"
          test -f "$SRC/p11a0.txt"
          test -f "$SRC/p11a1.txt"
          test -f "$SRC/p11a20.txt"
          test -f "$SRC/p11a21.txt"
          test -f "$SRC/p11a22-raw.txt"
          test -f "$SRC/p11a23.txt"
          test -f "$SRC/p11a3.txt"
          test -f "$SRC/p11b.txt"
          test -f "$SRC/p11c.txt"
          test -f "$SRC/p11d.txt"

          : > /tmp/project.tar.xz.b64
          for n in 00 01 02 03 04 05 06 07 08 09 10; do
            cat "$SRC/part${n}.b64" >> /tmp/project.tar.xz.b64
          done
          cat "$SRC/p11a0.txt" "$SRC/p11a1.txt" "$SRC/p11a20.txt" "$SRC/p11a21.txt" >> /tmp/project.tar.xz.b64
          base64 --decode "$SRC/p11a22-raw.txt" >> /tmp/project.tar.xz.b64
          cat "$SRC/p11a23.txt" "$SRC/p11a3.txt" "$SRC/p11b.txt" "$SRC/p11c.txt" "$SRC/p11d.txt" >> /tmp/project.tar.xz.b64
          cat "$SRC/part12.b64" >> /tmp/project.tar.xz.b64

          test "$(wc -c < /tmp/project.tar.xz.b64)" -eq 99228
          base64 --decode /tmp/project.tar.xz.b64 > /tmp/project.tar.xz
          test "$(wc -c < /tmp/project.tar.xz)" -eq 74420
          echo "2e0987f56a00a6cf550dcf59c350bf8144a0186dd57a684b24c5defb6773cf54  /tmp/project.tar.xz" | sha256sum --check -
          mkdir -p /tmp/cockroach-build
          tar -xJf /tmp/project.tar.xz -C /tmp/cockroach-build
          test -f /tmp/cockroach-build/CockroachVirtualDissectionAndroid/app/src/main/assets/www/index.html
          echo "PROJECT_DIR=/tmp/cockroach-build/CockroachVirtualDissectionAndroid" >> "$GITHUB_ENV"

      - name: Pin AndroidX to the API 36 compatible line
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text(encoding='utf-8')
          required={
              "androidx.activity:activity:1.13.0":"androidx.activity:activity:1.11.0",
              "androidx.core:core:1.19.0":"androidx.core:core:1.17.0",
          }
          for old,new in required.items():
              if old not in s:
                  raise SystemExit(f'Expected dependency not found: {old}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq "androidx.activity:activity:1.11.0" app/build.gradle
          grep -Fq "androidx.core:core:1.17.0" app/build.gradle
          ! grep -Fq "androidx.activity:activity:1.13.0" app/build.gradle
          ! grep -Fq "androidx.core:core:1.19.0" app/build.gradle

      - name: Qualify API 27 navigation bar style
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          base=Path('app/src/main/res/values/styles.xml')
          original=base.read_text(encoding='utf-8')
          item='        <item name="android:windowLightNavigationBar">false</item>\n'
          if original.count(item) != 1:
              raise SystemExit('Expected exactly one windowLightNavigationBar item in base styles')
          base.write_text(original.replace(item,''),encoding='utf-8')
          v27=Path('app/src/main/res/values-v27/styles.xml')
          v27.parent.mkdir(parents=True,exist_ok=True)
          v27.write_text(original,encoding='utf-8')
          PY
          ! grep -Fq 'android:windowLightNavigationBar' app/src/main/res/values/styles.xml
          grep -Fq 'android:windowLightNavigationBar' app/src/main/res/values-v27/styles.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'emulator'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Static scientific and HTML audit
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          grep -Fq "id 'com.android.application' version '9.3.2'" build.gradle
          python3 tools/verify_lab.py

      - name: JavaScript syntax audit
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import re
          source=Path('app/src/main/assets/www/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', source, re.S|re.I)
          assert scripts, 'No inline JavaScript found'
          Path('/tmp/cockroach-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          print('inline_scripts', len(scripts))
          PY
          node --check /tmp/cockroach-inline.js

      - name: Build, lint and package
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle :app:lintDebug :app:assembleDebug :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Verify APK package and bundled laboratory
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING"
          grep -Fq "package: name='in.gov.tn.gascngl.zoology.cockroachlab' versionCode='21000' versionName='2.1.0'" <<<"$BADGING"
          unzip -p "$APK" assets/www/index.html > /tmp/apk-index.html
          cmp --silent /tmp/apk-index.html app/src/main/assets/www/index.html
          ! grep -q '<uses-permission android:name="android.permission.INTERNET"' app/src/main/AndroidManifest.xml

      - name: Enable KVM hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is not available on this runner"
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: API 36 emulator instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          disable-linux-hw-accel: false
          script: cd "$PROJECT_DIR" && gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Package verified outputs
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/Cockroach-Virtual-Dissection-v2.1.0-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/Cockroach-Virtual-Dissection-v2.1.0-release-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/Cockroach-Virtual-Dissection-v2.1.0-release-unsigned.aab
          sha256sum artifacts/Cockroach-* > artifacts/SHA256SUMS.txt
          {
            echo '# GitHub CI Build Report'
            echo
            echo '- Baseline reconstructed archive SHA-256: PASS (2e0987f56a00a6cf550dcf59c350bf8144a0186dd57a684b24c5defb6773cf54)'
            echo '- API: 36'
            echo '- AGP: 9.3.2'
            echo '- Gradle: 9.5.0'
            echo '- JDK: 17'
            echo '- AndroidX Activity: 1.11.0 (API-36 line)'
            echo '- AndroidX Core: 1.17.0 (API-36 line)'
            echo '- API-27 navigation style qualification: PASS'
            echo '- HTML/static audit: PASS'
            echo '- JavaScript syntax: PASS'
            echo '- Android lint: PASS'
            echo '- Debug APK: PASS'
            echo '- Unsigned release APK/AAB: PASS'
            echo '- APK package/version verification: PASS'
            echo '- Offline asset byte comparison: PASS'
            echo '- INTERNET permission absent: PASS'
          } > artifacts/CI_BUILD_REPORT.md
          {
            echo '# CI Device Test Report'
            echo
            echo '- API 36 Google APIs x86_64 emulator: PASS'
            echo '- Instrumentation suite: PASS'
            echo '- Physical-device stress test: not performed by CI'
          } > artifacts/CI_DEVICE_TEST_REPORT.md
          cp BUILD_REPORT.md DEVICE_TEST_REPORT.md artifacts/
          (
            cd /tmp/cockroach-build
            zip -qr "$PROJECT_DIR/artifacts/CockroachVirtualDissectionAndroidStudio_v2.1.0.zip" CockroachVirtualDissectionAndroid \
              -x 'CockroachVirtualDissectionAndroid/app/build/*' \
                 'CockroachVirtualDissectionAndroid/.gradle/*' \
                 'CockroachVirtualDissectionAndroid/artifacts/*'
          )
          sha256sum artifacts/CockroachVirtualDissectionAndroidStudio_v2.1.0.zip >> artifacts/SHA256SUMS.txt

      - name: Upload verified build outputs
        uses: actions/upload-artifact@v4
        with:
          name: Cockroach-Virtual-Dissection-v2.1.0-build
          path: /tmp/cockroach-build/CockroachVirtualDissectionAndroid/artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cockroach-Virtual-Dissection-v2.1.0-test-reports
          path: |
            /tmp/cockroach-build/CockroachVirtualDissectionAndroid/app/build/reports/
            /tmp/cockroach-build/CockroachVirtualDissectionAndroid/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 30
