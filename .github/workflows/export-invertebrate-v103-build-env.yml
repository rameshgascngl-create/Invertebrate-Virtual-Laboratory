name: Export Invertebrate v1.0.3 Build Environment

on:
  push:
    branches: [ android-v1.0.3-build ]
    paths:
      - '.github/workflows/export-invertebrate-v103-build-env.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-build-env:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Download Gradle 8.9
        run: |
          set -euo pipefail
          curl -L --retry 4 --fail -o /tmp/gradle-8.9-bin.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --version

      - name: Prime exact v1.0.3 dependencies
        run: |
          set -euo pipefail
          P=/tmp/invertebrate-primer
          mkdir -p "$P/app/src/main/java/com/gasczoology/invertebratelab"
          mkdir -p "$P/app/src/main/res/values"
          cat > "$P/settings.gradle.kts" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "InvertebratePrimer"
          include(":app")
          EOF
          cat > "$P/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF
          cat > "$P/gradle.properties" <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          EOF
          cat > "$P/app/build.gradle.kts" <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.gasczoology.invertebratelab"
              compileSdk = 36
              defaultConfig { applicationId = "com.gasczoology.invertebratelab"; minSdk = 24; targetSdk = 36; versionCode = 103; versionName = "1.0.3" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.webkit:webkit:1.12.1")
              implementation("androidx.activity:activity-ktx:1.9.3")
          }
          EOF
          cat > "$P/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@style/AppTheme"><activity android:name=".MainActivity" android:exported="true"/></application></manifest>
          EOF
          cat > "$P/app/src/main/res/values/styles.xml" <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/></resources>
          EOF
          cat > "$P/app/src/main/java/com/gasczoology/invertebratelab/MainActivity.kt" <<'EOF'
          package com.gasczoology.invertebratelab
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.webkit.WebViewAssetLoader
          class MainActivity : ComponentActivity() { override fun onCreate(savedInstanceState: Bundle?) { super.onCreate(savedInstanceState); WebViewAssetLoader.Builder().addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this)).build() } }
          EOF
          cd "$P"
          /tmp/gradle-8.9/bin/gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Stage offline build environment
        run: |
          set -euo pipefail
          mkdir -p /tmp/v103-build-env/gradle-home /tmp/v103-build-env/android-sdk
          cp -a /tmp/gradle-8.9 /tmp/v103-build-env/
          cp -a "$HOME/.gradle/caches" /tmp/v103-build-env/gradle-home/
          [ ! -d "$HOME/.gradle/native" ] || cp -a "$HOME/.gradle/native" /tmp/v103-build-env/gradle-home/
          cp -a "$ANDROID_SDK_ROOT/platforms/android-36" /tmp/v103-build-env/android-sdk/
          mkdir -p /tmp/v103-build-env/android-sdk/build-tools
          cp -a "$ANDROID_SDK_ROOT/build-tools/36.0.0" /tmp/v103-build-env/android-sdk/build-tools/
          cp -a "$ANDROID_SDK_ROOT/platform-tools" /tmp/v103-build-env/android-sdk/
          printf 'AGP=8.7.3\nKotlin=2.0.21\nGradle=8.9\ncompileSdk=36\nwebkit=1.12.1\nactivity-ktx=1.9.3\n' > /tmp/v103-build-env/BUILD_ENV.txt
          find /tmp/v103-build-env -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/v103-build-env/SHA256SUMS.txt

      - name: Upload build environment
        uses: actions/upload-artifact@v7
        with:
          name: InvertebrateLab-v1.0.3-offline-build-env
          path: /tmp/v103-build-env
          compression-level: 6
          if-no-files-found: error
