name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct baseline offline laboratory HTML
        shell: bash
        run: |
          set -euo pipefail
          test "$(find source -maxdepth 1 -type f -name 'index.xz.b64.part-*' | wc -l)" -eq 13
          mkdir -p app/src/main/assets/www
          cat source/index.xz.b64.part-* > /tmp/index.xz.b64
          test "$(wc -c < /tmp/index.xz.b64)" -eq 227996
          base64 --decode /tmp/index.xz.b64 > /tmp/index.html.xz
          xz --decompress --stdout /tmp/index.html.xz > app/src/main/assets/www/index.html
          echo "07b52a03707f9f0114a0d047bec8f295d70226b0c944cd44a359858e358aff97  app/src/main/assets/www/index.html" | sha256sum --check -
          test "$(wc -c < app/src/main/assets/www/index.html)" -eq 1034941

      - name: Apply audited Tamil Nadu terminology revision
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tn_tamil_patch.py app/src/main/assets/www/index.html
          echo "fb1b149089f401f1fa99bd759683fe4f52b2959ad9936a3cb8b383585b288609  app/src/main/assets/www/index.html" | sha256sum --check -
          test "$(wc -c < app/src/main/assets/www/index.html)" -eq 1036211
          ! grep -q 'சிலியா' app/src/main/assets/www/index.html
          ! grep -q 'கொடிமயிர்' app/src/main/assets/www/index.html
          ! grep -q 'புரவலர்' app/src/main/assets/www/index.html
          ! grep -q 'போலிசீலோம்' app/src/main/assets/www/index.html
          ! grep -q 'குறுஇழைக்கள்' app/src/main/assets/www/index.html

      - name: Verify Tamil patch is idempotent
        shell: bash
        run: |
          set -euo pipefail
          cp app/src/main/assets/www/index.html /tmp/index.once.html
          python3 tools/tn_tamil_patch.py app/src/main/assets/www/index.html
          cmp --silent /tmp/index.once.html app/src/main/assets/www/index.html
          test "$(grep -Fc 'TN Tamil terminology revision: v1.0.2' app/src/main/assets/www/index.html)" -eq 1
          test "$(grep -Fo 'துளையுடலிகள் (Porifera)' app/src/main/assets/www/index.html | wc -l)" -ge 1
          ! grep -q 'துளையுடலிகள் (துளையுடலிகள்' app/src/main/assets/www/index.html

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Inspect APK package
        shell: bash
        run: |
          set -euo pipefail
          BADGING="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk)"
          printf '%s\n' "$BADGING"
          grep -Fq "package: name='com.gasczoology.invertebratelab' versionCode='102' versionName='1.0.2'" <<<"$BADGING"
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/www/index.html > /tmp/apk-index.html
          echo "fb1b149089f401f1fa99bd759683fe4f52b2959ad9936a3cb8b383585b288609  /tmp/apk-index.html" | sha256sum --check -

      - name: Record APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Invertebrate-Virtual-Laboratory-v1.0.2-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
